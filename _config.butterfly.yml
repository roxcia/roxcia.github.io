# Site-specific Butterfly overrides.
# The theme itself is tracked as a Git submodule at themes/butterfly.

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/roxcia || GitHub || '#24292e'

favicon: /img/favicon.ico

background: '#f8f4ef'

default_top_img: /img/404.jpg
index_img: /img/404.jpg
archive_img: /img/404.jpg
tag_img: /img/404.jpg
category_img: /img/404.jpg

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 用文字沉淀日常
    - 用代码整理世界

aside:
  card_author:
    enable: true
    description: roxci，一个热爱技术、审美和生活记录的女生
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/roxcia
  card_announcement:
    enable: true
    content: 欢迎来到 roxcia的博客，愿这里的文字清爽、真诚，也有一点漂亮。

beautify:
  enable: true
  field: site
  title_prefix_icon: '\f5ad'
  title_prefix_icon_color: '#e56b8c'

theme_color:
  enable: true
  main: '#e56b8c'
  paginator: '#47a7a1'
  button_hover: '#6d71d9'
  text_selection: '#f3c6d4'
  link_color: '#d85f83'
  meta_color: '#7b7280'
  hr_color: '#ead7c7'
  code_foreground: '#b34e6f'
  code_background: '#fff5f8'
  toc_color: '#47a7a1'
  blockquote_padding_color: '#e56b8c'
  blockquote_background_color: '#fff2f6'
  scrollbar_color: '#e56b8c'
  meta_theme_color_light: '#f8f4ef'
  meta_theme_color_dark: '#191724'

inject:
  head:
    - <link rel="stylesheet" href="/css/roxci-theme.css">
