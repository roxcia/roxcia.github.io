# Site-specific Butterfly overrides.
# The theme itself is tracked as a Git submodule at themes/butterfly.

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/roxcia || GitHub || '#24292e'

favicon: /img/favicon.ico

background: '#f8f4ef'

default_top_img: /img/404.jpg
index_img: /img/404.jpg
archive_img: /img/404.jpg
tag_img: /img/404.jpg
category_img: /img/404.jpg

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 用文字沉淀日常
    - 用代码整理世界

aside:
  card_author:
    enable: true
    description: roxci，一个热爱技术、审美和生活记录的女生
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/roxcia
  card_announcement:
    enable: true
    content: 欢迎来到 roxcia的博客，愿这里的文字清爽、真诚，也有一点漂亮。

beautify:
  enable: true
  field: site
  title_prefix_icon: '\f5ad'
  title_prefix_icon_color: '#e56b8c'

theme_color:
  enable: true
  main: '#49b1f5'
  paginator: '#ff9ac2'
  button_hover: '#ff8f91'
  text_selection: '#fca4d4'
  link_color: '#49b1f5'
  meta_color: '#8d99ae'
  hr_color: '#d8ecff'
  code_foreground: '#e65f8f'
  code_background: '#fff5fb'
  toc_color: '#fca4d4'
  blockquote_padding_color: '#49b1f5'
  blockquote_background_color: '#f3f9ff'
  scrollbar_color: '#fca4d4'
  meta_theme_color_light: '#f7fbff'
  meta_theme_color_dark: '#191724'

inject:
  head:
    - <link rel="stylesheet" href="/css/roxci-theme.css">
  bottom:
    - <script async src="/js/title.js"></script>

preloader:
  enable: true
  source: 3
  avatar: /img/butterfly-icon.png
  load_image: /img/404.jpg
  load_color: '#f6eff6'
  pace_css_url:
