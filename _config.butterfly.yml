# Site-specific Butterfly overrides.
# The theme itself is tracked as a Git submodule at themes/butterfly.

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/roxcia || GitHub || '#24292e'

favicon: /img/favicon.ico

background: '#f8f4ef'

default_top_img: /img/background.jpg
index_img: /img/background.jpg
archive_img: /img/background.jpg
tag_img: /img/background.jpg
category_img: /img/background.jpg

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 用文字沉淀日常
    - 用代码整理世界

aside:
  card_author:
    enable: true
    description: roxcia，一个热爱技术、审美和生活记录的女生
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/roxcia
  card_announcement:
    enable: true
    content: 欢迎来到 roxcia的博客，愿这里的文字清爽、真诚，也有一点漂亮。

beautify:
  enable: true
  field: site
  title_prefix_icon: '\f5ad'
  title_prefix_icon_color: '#e56b8c'

theme_color:
  enable: true
  main: '#49b1f5'
  paginator: '#ff9ac2'
  button_hover: '#ff8f91'
  text_selection: '#fca4d4'
  link_color: '#49b1f5'
  meta_color: '#8d99ae'
  hr_color: '#d8ecff'
  code_foreground: '#e65f8f'
  code_background: '#fff5fb'
  toc_color: '#fca4d4'
  blockquote_padding_color: '#49b1f5'
  blockquote_background_color: '#f3f9ff'
  scrollbar_color: '#fca4d4'
  meta_theme_color_light: '#f7fbff'
  meta_theme_color_dark: '#191724'

inject:
  head:
    - <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
    - <link rel="stylesheet" href="/css/pace-custom.css">
    - <script>window.paceOptions = { restartOnPushState:false };</script>
    - <script src="//cdn.bootcss.com/pace/1.0.2/pace.min.js"></script>
    - <link rel="stylesheet" href="/css/cat.css">
    - <link rel="stylesheet" href="/css/roxci-theme.css">
  bottom:
    - <script defer src="https://npm.elemecdn.com/jquery@latest/dist/jquery.min.js"></script>
    - <script defer data-pjax src="/js/cat.js"></script>
    - <script async src="/js/title.js"></script>
    - <script src="/js/ban-ie.js"></script>
    - <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    - <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
    - <script src="/js/sun_moon.js"></script>

preloader:
  enable: true
  source: 3
  avatar: /img/butterfly-icon.png
  load_image: /img/background.jpg
  load_color: '#f6eff6'
  pace_css_url: /css/pace-custom.css

# hexo-butterfly-categories-card
# see https://akilar.top/posts/a9131002/
categoryBar:
  enable: true
  priority: 5
  enable_page: /
  layout:
    type: id
    name: recent-posts
    index: 0
  column: odd
  row: 1
  message:
    - descr: 博客搭建记录
      cover: /img/background.jpg
    - descr: htb prolab
      cover: /img/background.jpg
    - descr: java代码审计
      cover: /img/background.jpg
    - descr: 内网渗透知识总结
      cover: /img/background.jpg
    - descr: htblabs
      cover: /img/background.jpg
    - descr: prolabs
      cover: /img/background.jpg
  custom_css: /css/categorybar.css

banIE:
  enable: true
  message: 当前浏览器版本较旧，建议使用 Chrome、Edge 或 Firefox 浏览 roxcia的博客。

# 友链样式：butterfly 为默认样式，volantis 为站点卡片样式，flexcard 为弹性卡片样式
flink_style: volantis

# Search
search:
  use: local_search
  placeholder: Search for Posts
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

# Mouse click effects: fireworks
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

# Mouse click effects: Heart symbol
click_heart:
  enable: false
  mobile: false

# Mouse click effects: words
clickShowText:
  enable: true
  text:
    - 富强
    - 民主
    - 文明
    - 和谐
    - 爱国
    - 敬业
    - 诚信
    - 友善
    - 自由
    - 平等
    - 公正
    - 法治
  fontSize: 15px
  random: false
  mobile: true
